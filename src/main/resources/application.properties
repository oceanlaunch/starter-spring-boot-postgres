spring.application.name=spring-boot-postgres

# On OceanLaunch, connecting the database sets SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD, which take the
# place of these. The values below are for a PostgreSQL on your own computer (see the README).
spring.datasource.url=jdbc:postgresql://localhost:5432/app
spring.datasource.username=app
spring.datasource.password=app

# Flyway makes the tables from src/main/resources/db/migration; Hibernate only checks they match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# OceanLaunch checks /actuator/health (which includes the database) before sending traffic to a new version.
management.endpoints.web.exposure.include=health
